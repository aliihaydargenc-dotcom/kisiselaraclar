<!doctype html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <meta name="theme-color" content="#f2efe8" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="Notlar" />
  <meta name="description" content="Notlar, günlük plan ve görevler için sakin kişisel çalışma alanı." />
  <title>Notlar — sakin çalışma alanı</title>
  <script>
    (() => {
      try {
        const saved = localStorage.getItem("notlar:theme") || "system";
        const dark = saved === "dark" || (saved === "system" && matchMedia("(prefers-color-scheme: dark)").matches);
        document.documentElement.dataset.theme = dark ? "dark" : "light";
        document.documentElement.dataset.themePreference = saved;
        document.documentElement.style.colorScheme = dark ? "dark" : "light";
      } catch {}
    })();
  </script>
  <link rel="manifest" href="./manifest.webmanifest" />
  <link rel="icon" href="./app-icon.svg" type="image/svg+xml" />
  <link rel="apple-touch-icon" href="./app-icon.svg" />
  <link rel="stylesheet" href="./src/notes-workspace.css" />
  <link rel="stylesheet" href="./src/theme.css" />
  <link rel="stylesheet" href="./src/mobile-keyboard-stability.css" />
</head>
<body class="auth-pending">
  <section id="authGate" class="auth-gate" aria-live="polite">
    <div class="auth-card">
      <div class="auth-brand"><b>N</b><span>Notlar</span><small style="margin-left:auto;opacity:.55;font:700 11px/1 system-ui">P46</small></div>
      <h1 id="authTitle">Özel alan açılıyor.</h1>
      <p id="authCopy">Oturum ve notların hazırlanıyor.</p>
      <div id="authBody"></div>
      <p id="authStatus" role="status">P46 · HTML yüklendi.</p>
    </div>
  </section>
  <div id="app"></div>
  <script>
    (() => {
      window.__NOTLAR_BUILD__ = "P46";
      const setStatus = (text, tone = "") => {
        const status = document.querySelector("#authStatus");
        if (!status) return;
        status.textContent = text;
        status.dataset.tone = tone;
      };
      setStatus("P46 · JavaScript aktif.");
      window.addEventListener("error", (event) => {
        setStatus(`P46 · JS hata: ${event.message || "bilinmeyen hata"}`, "error");
      });
      window.addEventListener("unhandledrejection", (event) => {
        setStatus(`P46 · Başlatma hatası: ${event.reason?.message || String(event.reason || "bilinmeyen hata")}`, "error");
      });
      window.setTimeout(() => {
        if (document.body.classList.contains("auth-ready")) return;
        const body = document.querySelector("#authBody");
        if (body?.childElementCount) return;
        const title = document.querySelector("#authTitle");
        const copy = document.querySelector("#authCopy");
        if (title) title.textContent = "Başlatma tamamlanamadı.";
        if (copy) copy.textContent = "P46 tanılama modu etkin. Aşağıdaki durum mesajını paylaş.";
        setStatus("P46 · 12 saniye zaman aşımı.", "warning");
        if (body) {
          body.innerHTML = '<button type="button" class="primary-button" id="authBootstrapRetry">Tekrar dene</button>';
          document.querySelector("#authBootstrapRetry")?.addEventListener("click", () => location.reload());
        }
      }, 12000);
    })();
  </script>
  <script type="module" src="./src/app-bootstrap.js"></script>
</body>
</html>
