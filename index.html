<!doctype html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Türkçe, local-first kişisel araçlar. Veriler mümkün olduğunca cihazınızda işlenir." />
  <title>Kişisel Araçlar</title>
  <link rel="stylesheet" href="./src/styles.css" />
</head>
<body>
  <div class="app-shell">
    <header class="topbar">
      <div>
        <span class="eyebrow">KİŞİSEL ARAÇLAR</span>
        <h1>İşini tarayıcıda hallet.</h1>
        <p>Türkçe, hızlı ve mümkün olduğunca cihazında çalışan küçük araçlar.</p>
      </div>
      <div class="privacy-badge" title="Bu ilk araçlar tamamen tarayıcıda çalışır">
        <span aria-hidden="true">●</span>
        Local-first
      </div>
    </header>

    <main class="workspace">
      <aside class="sidebar">
        <label class="search-label" for="toolSearch">Araç ara</label>
        <input id="toolSearch" class="search-input" type="search" placeholder="PDF, JSON, Base64, metin..." autocomplete="off" />
        <div id="categoryList" class="category-list" aria-label="Araç kategorileri"></div>
        <div class="side-note">
          <strong>Gizlilik</strong>
          <span>Bu çekirdek sürümde veri sunucuya gönderilmez.</span>
        </div>
      </aside>

      <section class="content">
        <div id="catalogView"></div>
        <div id="toolView" class="tool-view hidden" aria-live="polite"></div>
      </section>
    </main>
  </div>

  <script type="module" src="./src/main.js"></script>
</body>
</html>
