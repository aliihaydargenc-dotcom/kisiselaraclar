name: Android APK

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "index.html"
      - "src/theme.css"
      - "src/theme-controller.js"
      - "src/mobile-keyboard-stability.js"
      - "src/mobile-keyboard-stability.css"
      - "capacitor.config.json"
      - "scripts/configure-android.mjs"
      - "scripts/check-android-config.mjs"
      - ".github/workflows/android-apk.yml"
      - "package.json"

permissions:
  contents: read

jobs:
  build-arm64-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Android SDK
        uses: android-actions/setup-android@v3

      - name: Install web dependencies
        run: npm ci --no-audit --no-fund

      - name: Install Capacitor 8
        run: npm install --no-save --no-audit --no-fund @capacitor/core@8 @capacitor/cli@8 @capacitor/android@8

      - name: Build web app
        run: npm run build

      - name: Create native Android shell
        run: |
          npx cap add android
          npx cap sync android
          node scripts/configure-android.mjs

      - name: Ensure Android platform SDK
        run: |
          COMPILE_SDK="$(grep -E 'compileSdkVersion' android/variables.gradle | grep -oE '[0-9]+' | head -1)"
          if [ -n "$COMPILE_SDK" ]; then
            yes | sdkmanager --licenses >/dev/null || true
            sdkmanager "platforms;android-${COMPILE_SDK}"
          fi

      - name: Build arm64 debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew :app:assembleDebug --no-daemon

      - name: Prepare APK artifact
        run: |
          mkdir -p artifacts
          APK="$(find android/app/build/outputs/apk/debug -type f -name '*.apk' | head -1)"
          test -n "$APK"
          cp "$APK" artifacts/Notlar-S25Plus-arm64-v8a-debug.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Notlar-S25Plus-arm64-v8a
          path: artifacts/Notlar-S25Plus-arm64-v8a-debug.apk
          if-no-files-found: error
          retention-days: 14
